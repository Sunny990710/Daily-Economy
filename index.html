C \uB418\uBA74 \uBD80\uC871\uD55C \uB3C8\uC744 \uAD6D\uC678\uB85C\uBD80\uD130 \uC870\uB2EC\uD558\uAC8C \uB418\uB294\uB370 \uC774\uB97C \uAD6D\uC678\uC800\uCD95(foreign savings)\uC774\uB77C\uACE0 \uD55C\uB2E4.", "r": ["\uC800\uCD95\uB960", "\uCD1D\uC800\uCD95", "\uD3C9\uADE0\uC18C\uBE44\uC131\uD5A5"] }, { "t": "\uAD6D\uC81C\uACB0\uC81C\uC740\uD589(BIS)", "i": "\u3131", "d": "BIS(BIS; Bank for International Settlements)\uB294 1930\uB144 \uD5E4\uC774\uADF8\uD611\uC815\uC744 \uBAA8\uCCB4\uB85C \uC124\uB9BD\uB41C \uC138\uACC4\uC5D0\uC11C \uAC00\uC7A5 \uC624\uB798\uB41C \uAD6D\uC81C\uAE08\uC735\uAE30\uAD6C\uB85C\uC11C \uC911\uC559\uC740\uD589 \uAC04 \uC815\uCC45\uD611\uB825\uC744 \uC8FC\uC694\uAE30\uB2A5\uC73C\uB85C \uD558\uACE0 \uC788\uC73C\uBA70 \uD604\uC7AC 60\uAC1C \uC911\uC559\uC740\uD589\uC774 \uD68C\uC6D0\uC740\uD589\uC73C\uB85C \uCC38\uC5EC\uD558\uACE0 \uC788\uB2E4.", "r": [] }, { "t": "\uAD6D\uC81C\uAE08\uC735\uC2DC\uC7A5", "i": "\u3131", "d": "\uAD6D\uC81C\uAE08\uC735\uC2DC\uC7A5\uC774\uB780 \uAD6D\uACBD\uC744 \uB118\uC5B4 \uC790\uAE08\uC758 \uC218\uC694\uC640 \uACF5\uAE09\uC744 \uC5F0\uACB0\uD574 \uC8FC\uB294 \uC2DC\uC7A5 \uB610\uB294 \uBAA8\uB4E0 \uAC70\uB798 \uBA54\uCEE4\uB2C8\uC998\uC744 \uB9D0\uD558\uBA70 \uB450 \uAC00\uC9C0 \uC758\uBBF8\uB85C \uC0AC\uC6A9\uB41C\uB2E4. \uCCAB\uC9F8, \uAD6C\uCCB4\uC801\uC778 \uC7A5\uC18C\uC758 \uAC1C\uB150\uC73C\uB85C \uB7F0\uB358, \uB274\uC695, \uB3C4\uCFC4 \uB4F1 \uC8FC\uC694 \uAD6D\uC81C\uAE08\uC735\uC758 \uC911\uC2EC\uC9C0\uB098 \uADF8 \uC9C0\uC5ED\uC5D0\uC11C \uC6B4\uC6A9\uB418\uB294 \uC99D\uAD8C\uAC70\uB798\uC18C \uB610\uB294 \uC120\uBB3C\uC635\uC158\uAC70\uB798\uC18C \uB4F1\uC744 \uB9D0\u2026", "r": ["\uAD6D\uC81C\uAE08\uC735\uC911\uC2EC\uC9C0"] }, { "t": "\uAD6D\uC81C\uAE08\uC735\uC911\uC2EC\uC9C0", "i": "\u3131", "d": "\uD2B9\uC815 \uAD6D\uAC00\uB098 \uC9C0\uC5ED\uC774 \uAD6D\uC81C\uAE08\uC735\uC2DC\uC7A5\uC73C\uB85C \uAE30\uB2A5\uD558\uAE30 \uC704\uD574\uC11C\uB294 \uC790\uAD6D \uD1B5\uD654\uC758 \uAD6D\uC81C\uD1B5 30 \uB3D9\uC77C\uD55C \uC870\uAC74\uC73C\uB85C \uC720\uAC00\uC99D\uAD8C \uCDE8\uB4DD\uC758 \uCCAD\uC57D\uC744 \uAD8C\uC720\uD558\uB294 \uAC83\uC744 \uB9D0\uD55C\uB2E4. \uAE08\uC735\uC2DC\uC7A5\uC740 \uD06C\uAC8C \uC740\uD589\uC758 \uC608\uB300\uC5C5\uBB34\uB97C \uC911\uC2EC\uC73C\uB85C \uD55C \uAC04\uC811\uAE08\uC735\uC2DC\uC7A5\uACFC \uC720\uAC00\uC99D\uAD8C \uC758 \uBC1C\uD589 \uC720\uD1B5\uC744 \uC704\uC8FC\uB85C \uD558\uB294 \uC9C1\uC811\uAE08\uC735\uC2DC\uC7A5\uC73C\uB85C \uB300\uBCC4\uB41C\uB2E4. \uC774\uB54C \uAC04\uC811\uAE08\uC735\uC2DC\uC7A5\uC758 \uACBD\uC6B0", "r": [] }, { "t": "\uBB34\uB514\uC2A4", "i": "\u3141", "d": "1909\uB144 \uCD9C\uD310\uC5C5\uC790\uC778 \uBBF8\uAD6D\uC758 John Moody\uAC00 \uCC3D\uC5C5\uD558\uC600\uC73C\uBA70 1909\uB144 \uCC44\uAD8C\uC2E0\uC6A9 \uD3C9\uAC00\uC5C5\uBB34\uB97C \uAC1C\uC2DC\uD558\uC600\uB2E4. 1929\uB144 \uC138\uACC4 \uB300\uACF5\uD669 \uB54C \uBB34\uB514\uC2A4\uAC00 \u2018\uD22C\uC790\uC801\uACA9\u2019\uC73C\uB85C \uD3C9\uAC00\uD55C \uAE30\uC5C5\uB4E4\uC774 \uCC44\uBB34\uB97C 100% \uC774\uD589\uD558\uAC8C \uB418\uBA74\uC11C \uB192\uC740 \uC2E0\uB8B0\uC640 \uBA85\uC131\uC744 \uD68D\uB4DD\uD55C \uC774\uD6C4 \uC138\uACC4\uC801\uC778 \uD22C\uC790\uC790\uBB38\uD68C\uC0AC\uB85C \uC131\uC7A5 \uD558\u2026", "r": ["\uC2A4\uD0E0\uB354\uB4DC & \uD478\uC5B4\uC2A4"] }, { "t": "\uBB34\uC5ED\uC9C0\uC218", "i": "\u3141", "d": "\uC77C\uBC18\uC801\uC73C\uB85C \uAC70\uB798\uAE08\uC561\uC758 \uBCC0\uB3D9\uC740 \uAC00\uACA9\uC774 \uBCC0\uD558\uAC70\uB098 \uBB3C\uB7C9\uC774 \uBCC0\uD558\uAC70\uB098 \uB610\uB294 \uAC00\uACA9\uACFC \uBB3C\uB7C9\uC774 \uB3D9\uC2DC\uC5D0 \uBCC0\uD558\uAE30 \uB54C\uBB38\uC774\uB2E4. \uBB34\uC5ED\uC9C0\uC218\uB294 \uACBD\uC81C\uC131\uC7A5, \uACE0\uC6A9 \uB4F1\uACFC \uBC00\uC811\uD55C \uAD00\uACC4\uB97C \uAC16\uACE0 \uC788\uB294 \uC218\uCD9C\uC561 \uB610\uB294 \uC218\uC785\uC561\uC758 \uBCC0\uB3D9\uC694\uC778\uC744 \uAC00\uACA9\uC694\uC778\uACFC \uBB3C\uB7C9\uC694\uC778\uC73C\uB85C \uB098\uB204\uC5B4 \uBD84\uC11 , "d": "\uB9AC\uC2A4\uD06C\uC5D0 \uB178\uCD9C\uB418\uC5B4 \uC788\uB294 \uAE08\uC561\uC744 \uC758\uBBF8\uD558\uBA70 \uB9AC\uC2A4\uD06C \uC720\uD615\uC5D0 \uB530\uB77C \uC2DC\uC7A5\uB9AC\uC2A4\uD06C \uC775\uC2A4\uD3EC\uC800, \uC2E0\uC6A9\uB9AC\uC2A4\uD06C \uC775\uC2A4\uD3EC\uC800 \uB4F1\uC73C\uB85C \uAD6C\uBD84\uB41C\uB2E4. \uC2DC\uC7A5\uB9AC\uC2A4\uD06C \uC775\uC2A4\uD3EC\uC800\uB294 \uAE08\uB9AC, \uD658\uC728, \uC8FC\uAC00 \uB4F1\uC758 \uBCC0\uB3D9\uC5D0 \uB530\uB978 \uAC00\uCE58 \uBCC0\uB3D9\uC5D0 \uB530\uB978 \uC190\uC2E4 \uAC00\uB2A5\uC131\uC5D0 \uB178\uCD9C\uB41C \uAE08\uC561\uC744, \uC2E0\uC6A9\uB9AC\uC2A4\uD06C \uC775\uC2A4\uD3EC\uC800\uB294", "r": [] }, { "t": "\uC778\uAD6C\uACE0\uB839\uD654", "i": "\u3147", "d": "\uC778\uAC04\uC758 \uD3C9\uADE0 \uC218\uBA85\uC774 \uC99D\uAC00\uD558\uACE0 \uCD9C\uC0B0\uC728\uC774 \uAC10\uC18C\uD568\uC5D0 \uB530\uB77C \uC120\uC9C4\uAD6D\uC744 \uC911\uC2EC\uC73C\uB85C \uACE0\uB839\uC790\uC758 \uC778\uAD6C \uBE44\uC728\uC774 \uC810\uCC28 \uB192\uC544\uC838 \uAC00\uB294 \uD604\uC0C1 \uB610\uB294 \uADF8\uB7EC\uD55C \uC0C1\uD0DC\uB97C \uACE0\uB839\uD654\uB77C\uACE0 \uD55C\uB2E4.", "r": ["\uD569\uACC4\uCD9C\uC0B0\uC728"] }, { "t": "\uC778\uC801\uC790\uBCF8", "i": "\u3147", "d": "\uAC1C\uC778\uC774 \uBCF4\uC720\uD55C \uB2A5\uB825, \uAE30\uC220\uC219\uB828\uB3C4, \uC9C0\uC2DD \uB4F1\uC744 \uD3EC\uAD04\uD558\uB294 \uAC83\uC73C\uB85C \uB178\uB3D9\uC758 \uC9C8\uC801 \uC218\uC900\uC744 \uC758\uBBF8\uD55C\uB2E4. \uC778\uC801\uC790\uBCF8(human capital)\uC774\uB780 \uAC1C\uB150\uC740 1960\uB144\uB300 \uCD08\uC5D0 \uBBF8\uAD6D\uC758 \uB18D\uC5C5\uACBD\uC81C\uD559\uC790\uC778 \uC290\uCE20(T.", "r": ["\uB178\uB3D9\uC0DD\uC0B0\uC131", "\uB178\uB3D9\uC0DD\uC0B0\uC131\uC9C0\uC218"] }, { "t": "\uC778\uD130\uB137\uBC45\uD0B9", "i": "\u3147", "d": "\uC778\uD130\uB137\uBC45\uD0B9\uC774\uB780 \uACE0\uAC1D\uC774 \uC790\uAE08\uC774\uCCB4, \uACC4\uC88C\uC870\uD68C \uB4F1 \uC740\uD589 \uC5C5\uBB34\uB97C \uC778\uD130\uB137\uC744 \uD1B5\uD574 \uC6D0\uACA9\uC9C0\uC5D0\uC11C \uCC98\uB9AC\uD560 \uC218 \uC788\uB294 \uAE08\uC735\uC11C\uBE44\uC2A4\uC774\uB2E4. \uD734\uB300\uC804\uD654 \uB4F1 \uBAA8\uBC14\uC77C\uAE30\uAE30\uB97C \uC774\uC6A9\uD558\uB294 \uBAA8\uBC14\uC77C\uBC45\uD0B9\uC758 \uACBD\uC6B0\uB3C4 \uB113\uC740 \uC758\uBBF8\uC5D0\uC11C \uC778\uD130\uB137\uBC45\uD0B9\uC758 \uBC94\uC8FC\uC5D0 \uD3EC\uD568\uB41C\uB2E4.", "r": ["\uBAA8\uBC14\uC77C\uBC45\uD0B9", "\uD154\uB808\uBC45\uD0B9(\uD3F0\uBC45\uD0B9)"] }, { "t": "\uC778\uD130\uB137\uC804\uBB38\uC740\uD589", "i": "\u3147", "d": "\uC810\uD3EC\uC5C6\uC774 \uB610\uB294 \uC18C\uC218\uC758 \uC601\uC5C5\uC810\uB9CC\uC744 \uB450\uACE0 \uC778\uD130\uB137, \uBAA8\uBC14\uC77C, ATM \uB4F1 \uC804\uC790\uB9E4\uCCB4\uB97C \uC8FC\uB41C \uC601\uC5C5\uCC44\uB110\uB85C \uD65C\uC6A9\uD558\uB294 \uC628\uB77C\uC778 \uAE30\uBC18\uC758 \uC740\uD589\uC73C\uB85C\uC11C, \uC774\uB294 \uC740\uD589\uC11C\uBE44\uC2A4\uB97C \uC778\uD130\uB137\uC73C\uB85C \uC81C\uACF5\uD558 \uB294 \uC601\uC5C5\uBC29\uC2DD\uC744 \uB73B\uD558\uB294 \uC778\uD130\uB137\uBC45\uD0B9\uACFC\uB294 \uB2E4\uB978 \uAC1C\uB150\uC774\uB2E4.", "r": ["\uD540\uD14C\uD06C"] }, { "t": "\uC778\uD50C\uB808\uC774\uC158", "i": "\u3147", "d": "\uBB3C\uAC00\uC218\uC900\uC774 \uC9C0\uC18D\uC801\uC73C\uB85C \uC0C1\uC2B9\uD558\uB294 \uD604\uC0C1\uC744 \uC778\uD50C\uB808\uC774\uC158\uC774\uB77C\uACE0 \uD55C\uB2E4. \uC5EC\uAE30\uC11C \uBB3C\uAC00\uB294 \uAC1C\uBCC4 \uC0C1\uD488\uC758 \uAC00\uACA9\uC744 \uD3C9\uADE0\uD558\uC5EC \uC0B0\uCD9C\uD55C \uBB3C\uAC00\uC9C0\uC218\uB97C \uC758\uBBF8\uD55C\uB2E4.", "r": ["\uB514\uC2A4\uC778\uD50C\uB808\uC774\uC158", "\uB514\uD50C\uB808\uC774\uC158"], "e": "\uBB3C\uAC74\uAC12\uC774 \uC804\uBC18\uC801\uC73C\uB85C \uACC4\uC18D \uC624\uB974\uB294 \uD604\uC0C1\uC774\uC5D0\uC694. \uAC19\uC740 \uB3C8\uC73C\uB85C \uC0B4 \uC218 \uC788\uB294 \uAC8C \uC810\uC810 \uC904\uC5B4\uB4E4\uC8E0.", "x": "\uC791\uB144\uC5D0 1,000\uC6D0\uC774\uB358 \uACFC\uC790\uAC00 \uC62C\uD574 1,200\uC6D0\uC774\uBA74 \uB0B4 \uB3C8\uC758 \uD798\uC774 \uADF8\uB9CC\uD07C \uC57D\uD574\uC9C4 \uAC70\uC608\uC694." }, { "t": "\uC77C\uBB3C\uC77C\uAC00\uC758 \uBC95\uCE59", "i": "\u3147", "d": "\uC644\uC804\uACBD\uC7C1\uC774 \uC774\uB8E8\uC5B4\uC9C8 \uB54C \uB3D9\uC77C\uD55C \uC2DC\uAE30, \uB3D9\uC77C\uD55C \uC2DC\uC7A5\uC5D0\uC11C\uB294 \uD488\uC9C8\uC774 \uB3D9\uC77C\uD55C \uC0C1\uD488\uC758 \uAC00\uACA9 \uC774 2\uAC1C \uC774\uC0C1 \uD615\uC131\uB420 \uC218 \uC5C6\uB2E4\uB294 \uBC95\uCE59\uC774\uB2E4. \uC989 \uB3D9\uC77C\uD55C \uC0C1\uD488\uC740 \uC5B4\uB290 \uC2DC\uC7A5\uC5D0\uC11C\uB4E0\uC9C0 \uAC00\uACA9\uC774 \uAC19\uC544\uC9C0\uAC8C \uB41C\uB2E4\uB294 \uAC83\uC778\uB370 \uC81C\uBCF8\uC2A4(Jebons, W. S.)\uC640 \uC5E3\uC9C0\uC6CC\uC2A4(Edgeworth, F.", "r": ["\uAD6C\uB9E4\uB825\uD3C9\uAC00\uD658\uC728"] }, { "t": "\uC77C\uBC18\uD2B9\uD61C\uAD00\uC138", "i": "\u3147", "d": "\uAC1C\uBC1C\uB3C4\uC0C1\uAD6D\uC758 \uC218\uCD9C \uD655\uB300 \uBC0F \uACF5\uC5C5\uD654 \uCD09\uC9C4\uC744 \uC704\uD558\uC5EC, \uC120\uC9C4\uAD6D\uC774 \uAC1C\uBC1C\uB3C4\uC0C1\uAD6D\uC73C\uB85C\uBD80\uD130 \uC218\uC785\uB418\uB294 \uB18D\uC218\uC0B0\uBB3C, \uACF5\uC0B0\uD488 \uBC0F \uBC18\uC81C\uD488\uC5D0 \uB300\uD558\uC5EC\uB294 \uC544\uBB34\uB7F0 \uC870\uAC74 \uC5C6\uC774 \u201C\uC77C\uBC18\uC801\u201D\uC73C\uB85C \uBB34\uAD00\uC138 \uB610\uB294 \uC800\uC728\uC758 \uAD00\uC138\uB97C \uBD80\uACFC\uD558\uB294 \uAD00\uC138 \uC0C1\uC758 \uD2B9\uD61C\uB300\uC6B0\uB97C \uB9D0\uD55C\uB2E4.", "r": ["\uC0C1\uACC4\uAD00\uC138", "\uD560\uB2F9\uAD00\uC138\uC81C\uB3C4"] }, { "t": "\uC77C\uC911RP\uC81C\uB3C4", "i": "\u3147", "d": "\uC77C\uC911RP\uC81C\uB3C4\uB294 \uCD1D\uC561\uACB0\uC81C\uC2DC\uC2A4\uD15C\uC5D0\uC11C \uC911\uC559\uC740\uD589\uC774 \uCC38\uAC00\uAE30\uAD00\uC5D0\uAC8C \uD658\uB9E4\uC870\uAC74\uBD80\uC99D\uAD8C\uB9E4\uB9E4 (RP)\uB97C \uD1B5\uD574 \uB2F9\uC77C \uC0C1\uD658\uC744 \uC870\uAC74\uC73C\uB85C \uACB0\uC81C\uC5D0 \uAC00\uC6A9\uD560 \uC218 \uC788\uB294 \uC77C\uC911\uC720\uB3D9\uC131\uC744 \uC81C\uACF5\uD558\uB294 \uBC29\uBC95 uB294 \uC0B0\uC5C5\uC801 \uC720\uD1B5\uACFC", "r": [] }, { "t": "\uC790\uAE08\uC870\uB2EC\uBE44\uC6A9\uC9C0\uC218(COFIX)", "i": "\u3148", "d": "2000\uB144\uB300 \uD6C4\uBC18\uAE4C\uC9C0 CD \uAE08\uB9AC\uB294 \uC8FC\uD0DD\uB2F4\uBCF4\uB300\uCD9C\uC758 \uC8FC\uB41C \uC900\uAC70\uAE08\uB9AC\uB85C \uD65C\uC6A9\uB418\uC5B4 \uC654\uB2E4. \uADF8\uB7EC \uB098 CD\uAE08\uB9AC\uC640 \uC2DC\uC7A5\uAE08\uB9AC\uAC04 \uAD34\uB9AC\uAC00 \uD655\uB300\uB418\uB294 \uB4F1 \uBB38\uC81C\uAC00 \uBC1C\uC0DD\uD558\uC790 \uAE08\uC735\uB2F9\uAD6D\uACFC \uC740\uD589\uC5F0\uD569\uD68C\uB294 \uC740\uD589\uACFC\uC758 \uD611\uC758\uB97C \uAC70\uCCD0 \uC0C8\uB85C\uC6B4 \uB300\uCD9C \uC900\uAC70\uAE08\uB9AC\uB85C\uC11C \uC740\uD589\uC790\uAE08\uC870\uB2EC \uC0C1\uD488\uC758 \uAC00\uC911\uD3C9\uADE0\uAE08\uB9AC\uC778 \uC790\uAE08\uC870\uB2EC\uBE44\uC6A9\uC9C0\uC218(C\u2026", "r": [] }, { "t": "\uC790\uAE30\uB760 \uCE74\uB4DC", "i": "\u3148", "d": "\uC2E0\uC6A9\uCE74\uB4DC\uB098 \uC804\uD654\uCE74\uB4DC\uC640 \uAC19\uC774 \uC587\uC740 \uD50C\uB77C\uC2A4\uD2F1 \uCE74\uB4DC\uC5D0 \uC790\uC131\uCCB4 \uBB3C\uC9C8\uC744 \uB760 \uBAA8\uC591\uC73C\uB85C \uC785\uD788\uACE0 \uD544\uC694\uD55C \uC815\uBCF4\uB97C \uAE30\uB85D\uD55C \uCE74\uB4DC\uC774\uB2E4. \uC2E0\uC6A9\uCE74\uB4DC\uC758 \uC790\uAE30\uB760(magnetic stripe)\uC5D0\uB294 \uAD6D\uC81C\uD45C\uC900\uD654\uAE30 \uAD6C(ISO)\uAC00 \uC815\uD55C \uAE30\uC900\uC5D0 \uB530\uB77C \uCE74\uB4DC \uBC88\uD638, \uC720\uD6A8\uAE30\uAC04, \uC131\uBA85, \uC81C\uD734\uCF54\uB4DC \uB4F1 \uCE74\uB4DC \uBC0F \uD68C\uC6D0\uC5D0\u2026", "r": ["IC \uCE74\uB4DC"] }, { "t": "\uC790\uAE30\uC790\uBCF8\uBE44\uC728", "i": "\u3148", "d": "\uCD1D\uC790\uBCF8 \uC911\uC5D0\uC11C \uC790\uAE30\uC790\uBCF8\uC774 \uCC28\uC9C0\uD558\uB294 \uBE44\uC911\uC744 \uB098\uD0C0\uB0B4\uB294 \uB300\uD45C\uC801\uC778 \uC7AC\uBB34\uAD6C\uC870 \uC9C0\uD45C\uC774\uB2E4. \uC790\uAE30\uC790\uBCF8\uC740 \uAE08\uC735\uBE44\uC6A9\uC744 \uBD80\uB2F4\uD558\uC9C0 \uC54A\uACE0 \uAE30\uC5C5\uC774 \uC7A5\uAE30\uC uC9C0\uAE09\uC218\uB2E8"] }, { "t": "\uC9C0\uAE09\uACB0\uC81C\uC81C\uB3C4 \uAC10\uC2DC", "i": "\u3148", "d": "\uAD6D\uC81C\uACB0\uC81C\uC740\uD589(BIS)\uC758 \uC9C0\uAE09\uACB0\uC81C \uBC0F \uC2DC\uC7A5\uC778\uD504\uB77C \uC704\uC6D0\uD68C\uB294 \uC9C0\uAE09\uACB0\uC81C\uC81C\uB3C4 \uAC10\uC2DC(oversight of payment systems)\uB97C \u201C\uAE30\uC874 \uC2DC\uC2A4\uD15C \uBC0F \uC6B4\uC601 \uC608\uC815\uC778 \uC2DC\uC2A4\uD15C\uC744 \uBAA8\uB2C8\uD130\uB9C1\uD558\uACE0 \uB3D9 \uC2DC\uC2A4\uD15C\uC5D0 \uB300\uD574 \uD3C9\uAC00\uD558\uB294 \uD55C\uD3B8, \uD544\uC694\uC2DC \uAC1C\uC120\uC744 \uC720\uB3C4\uD568\uC73C\uB85C\uC368 \uB3D9 \uC2DC\uC2A4\uD15C\uB4E4\uC758 \uC548\uC804\uC131 \uBC0F \uD6A8\u2026", "r": [] }, { "t": "\uC9C0\uAE09\uC218\uB2E8", "i": "\u3148", "d": "\uC9C0\uAE09\uC218\uB2E8(payment instruments)\uC740 \uD06C\uAC8C \uD604\uAE08\uACFC \uD604\uAE08 \uC774\uC678\uC758 \uC9C0\uAE09\uC218\uB2E8\uC73C\uB85C \uAD6C\uBD84\uB41C\uB2E4. \uD604\uAE08 \uC774\uC678\uC758 \uC9C0\uAE09\uC218\uB2E8\uC740 \uAE08\uC735\uAE30\uAD00\uC744 \uAC70\uCCD0 \uD604\uAE08\uD654\uD560 \uC218 \uC788\uB294 \uC9C0\uAE09\uC218\uB2E8\uC744 \uB9D0\uD558\uB294\uB370 \uC5EC\uAE30\uC5D0 \uB294 \uACC4\uC88C\uC774\uCCB4, \uC9C0\uAE09\uCE74\uB4DC, \uC5B4\uC74C\uC774\uB098 \uC218\uD45C \uB4F1\uC774 \uD3EC\uD568\uB41C\uB2E4.", "r": ["\uC9C0\uAE09\uACB0\uC81C\uC2DC\uC2A4\uD15C"] }, { "t": "\uC9C0\uAE09\uC900\uBE44\uC790\uC0B0\uC81C\uB3C4", "i": "\u3148", "d": "\uC9C0\uAE09\uC900\uBE44\uC790\uC0B0\uC81C\uB3C4\uB780 \uD55C\uAD6D\uC740\uD589\uC774 \uD544\uC694\uD558\uB2E4\uACE0 \uC778\uC815\uB420 \uB54C \uAE08\uC735\uAE30\uAD00\uC5D0 \uB300\uD558\uC5EC \uC608\uAE08\uC9C0\uAE09 \uC900\uBE44\uAE08\uACFC\uB294 \uBCC4\uB3C4\uC758 \uC9C0\uAE09\uC900\uBE44\uC790\uC0B0\uC744 \uBCF4\uC720\uD560 \uC218 \uC788\uB294 \uC81C\uB3C4( \uD55C\uAD6D\uC740\uD589\uBC95 \uC81C63\uC870)\uC774\uB2E4. \uC9C0\uAE09\uC900\uBE44\uC790\uC0B0\uC5D0\uB294 \uD604\uAE08, \uAD6D\uCC44, \uC815\uBD80\uBCF4\uC99D\uCC44 \uBC0F \uD55C 8\uC744 \uAC00\uB9AC\uD0A8\uB2E4.", "r": ["\uC18C\uBE44\uC758 \uBE44\uAC00\uC5ED\uC131"] }, { "t": "\uD55C\uACC4\uD6A8\uC6A9", "i": "\u314E", "d": "\uC5B4\uB5A4 \uC0C1\uD488\uC774\uB098 \uC11C\uBE44\uC2A4\uC758 \uC18C\uBE44\uB97C \uD55C \uB2E8\uC704 \uB298\uB9BC\uC5D0 \uB530\uB77C \uCD94\uAC00\uB85C \uC99D\uAC00\uD55C \uD6A8\uC6A9\uC744 \uD55C\uACC4\uD6A8\uC6A9 \uC774\uB77C \uD55C\uB2E4. \uD55C\uACC4\uD6A8\uC6A9\uC740 \uCD1D\uD6A8\uC6A9\uC758 \uBCC0\uD654\uBD84\uC744 \uC18C\uBE44\uB7C9\uC758 \uBCC0\uD654\uBD84\uC73C\uB85C \uB098\uB214\uC73C\uB85C\uC368 \uACC4\uC0B0\uD560 \uC218 \uC788\uB2E4.", "r": ["\uD30C\uB808\uD1A0\uCD5C\uC801", "\uD55C\uACC4\uBE44\uC6A9"], "e": "\uAC19\uC740 \uAC78 \uD558\uB098 \uB354 \uAC00\uC84C\uC744 \uB54C \uCD94\uAC00\uB85C \uB290\uB07C\uB294 \uB9CC\uC871\uC774\uC5D0\uC694. \uB9CE\uC544\uC9C8\uC218\uB85D \uADF8 \uB9CC\uC871\uC740 \uC810\uC810 \uC904\uC5B4\uC694.", "x": "\uBC30\uACE0\uD50C \uB54C \uCCAB \uCE58\uD0A8 \uC870\uAC01\uC740 \uAFC0\uB9DB\uC774\uC9C0\uB9CC \uB2E4\uC12F \uC870\uAC01\uC9F8\uB294 \uAC10\uB3D9\uC774 \uD655 \uC904\uC8E0." }, { "t": "\uD55C\uAD6D\uC740\uD589", "i": "\u314E", "d": "\uC6B0\uB9AC\uB098\uB77C\uC758 \uC911\uC559\uC740\uD589\uC778 \uD55C\uAD6D\uC740\uD589\uC740 1950\uB144 6\uC6D4 12\uC77C \uD55C\uAD6D\uC740\uD589\uBC95 \uC5D0 \uC758\uD558\uC5EC \uC124\uB9BD\uB418 \uC5C8\uB2E4. \uD55C \uB098\uB77C\uC758 \uC911\uC559\uC740\uD589\uC774 \uC218\uD589\uD558\uB294 \uD1B5\uD654\uC815\uCC45\uC5D0\uB294 \uACBD\uC81C\uBC1C\uC804 \uACFC\uC815\uC5D0\uC11C \uB098\uD0C0\uB098\uB294 \uC2DC\uB300\uC801 \uACFC\uC81C\uAC00 \uBC18\uC601\uB418\uB294 \uAC8C \uBCF4\uD1B5\uC774\uB2E4.", "r": ["\uC911\uC559\uC740\uD589", "\uAE08\uC735\uC548\uC815", "\uBB3C\uAC00\uC548\uC815\uBAA9\uD45C\uC81C"] }, { "t": "\uD55C\uC2DC\uC801 \uADFC\uB85C\uC790", "i": "\u314E", "d": "\uADFC\uB85C\uAE30\uAC04\uC774 \uC815\uD574\uC838 \uC788\uC9C0 \uC54A\uB294 \uC0C1\uC2DC \uADFC\uB85C\uC790\uC640 \uB2EC\uB9AC \uADFC\uB85C \uAE30\uAC04\uC774 \uC815\uD574\u   font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;color:var(--ink);box-shadow:0 0 60px rgba(0,0,0,.08)}
.app, .app *{font-family:inherit}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 18px 120px}
::-webkit-scrollbar{width:0}
.lt{padding:54px 4px 8px;animation:fade .5s ease both}
.lt .eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.2px;display:flex;align-items:center;gap:5px}
.lt h1{font-size:32px;font-weight:800;letter-spacing:-.6px;line-height:1.12;margin-top:4px}
.lt .sub{font-size:14px;color:var(--sub);margin-top:7px;font-weight:500}
.hero{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px 22px 20px;margin-top:18px;animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
.hero .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.chip-cat{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:6px 12px;border-radius:999px;letter-spacing:.2px;display:flex;align-items:center;gap:5px}
.ic-btn{width:34px;height:34px;border-radius:999px;border:none;background:var(--bg);color:var(--sub2);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.ic-btn:active{transform:scale(.9)}
.term{font-size:30px;font-weight:800;letter-spacing:-.7px;line-height:1.18;word-break:keep-all}
.rule{height:1px;background:var(--hair);margin:20px 0 18px;border:0}
.sec-label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:9px}
.sec-label.blue{color:var(--accent)} .sec-label.amber{color:#C77800} .sec-label.gray{color:var(--sub2)}
.easy{font-size:16.5px;line-height:1.62;font-weight:500;color:#2B2B2E;word-break:keep-all;letter-spacing:-.2px}
.deftext{font-size:14.5px;line-height:1.62;font-weight:500;color:#48484A;word-break:keep-all;letter-spacing:-.2px}
.ex-box{background:var(--amber-soft);border-radius:var(--r-sm);padding:15px 16px;margin-top:20px;border:1px solid rgba(255,159,10,.16)}
.ex-text{font-size:15px;line-height:1.6;color:#5A4326;font-weight:500;word-break:keep-all;letter-spacing:-.2px}
.rel-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.rel-chip{font-size:13px;font-weight:600;color:var(--sub2);background:var(--bg);border:1px solid var(--hair2);padding:8px 13px;border-radius:999px;cursor:pointer;transition:.15s}
.rel-chip:active{transform:scale(.95);background:#EAEAEF}
.ai-btn{width:100%;margin-top:18px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:14.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:none;padding:13px;border-radius:14px;cursor:pointer;transition:.15s}
.ai-btn:active{transform:scale(.98)}
.ai-btn:disabled{opacity:.7}
.spin{animation:rot 1s linear infinite}
.tip{font-size:12.5px;color:var(--sub);text-align:center;margin-top:12px;font-weight:500;line-height:1.5}
.news{margin-top:22px;padding-top:20px;border-top:1px solid var(--hair)}
.news-item{display:flex;gap:11px;align-items:flex-start;text-decoration:none;color:inherit;padding:12px 0;border-bottom:1px solid var(--hair2)}
.news-item:last-child{border-bottom:0}
.news-fav{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.news-tt{font-size:14.5px;font-weight:600;line-height:1.42;color:var(--ink);letter-spacing:-.2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news-src{font-size:12px;color:var(--sub);margin-top:4px;font-weight:500}
.more{font-size:11.5px;color:var(--sub);font-weight:600;margin:14px 0 0}
.sk{background:linear-gradient(100deg,#ECECF0 30%,#F6F6F9 50%,#ECECF0 70%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:7px;height:14px;margin:9px 0}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.src-chips{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.src-chip{flex:1;min-width:96px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:13px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:11px 8px;border-radius:13px;text-decoration:none;transition:.15s}
.src-chip:active{transform:scale(.97)}
.hf{display:flex;gap:10px;margin-top:22px}
.btn-ghost{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;font-size:15px;font-weight:700;color:var(--ink);background:var(--bg);border:none;padding:14px;border-radius:15px;cursor:pointer;transition:.15s}
.btn-ghost:active{transform:scale(.97);background:#E7E7EC}
.search{display:flex;align-items:center;gap:8px;background:#E4E4EA;border-radius:13px;padding:11px 13px;margin-top:14px;color:var(--sub2)}
.search input{flex:1;border:none;background:transparent;outline:none;font-size:16px;color:var(--ink);font-weight:500}
.search input::placeholder{color:var(--sub)}
.cho{display:flex;gap:7px;overflow-x:auto;padding:14px 18px 4px;margin:0 -18px}
.cho::-webkit-scrollbar{display:none}
.cho-chip{flex:0 0 auto;font-size:14px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer;background:var(--card);color:var(--sub2);border:1px solid var(--hair2);transition:.15s}
.cho-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grp-h{font-size:13px;font-weight:800;color:var(--sub);margin:22px 4px 8px;letter-spacing:.3px}
.list{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:15px 17px;cursor:pointer;border-bottom:1px solid var(--hair2);transition:.12s}
.row:last-child{border-bottom:0} .row:active{background:#F4F4F7}
.row .rt{flex:1;min-width:0}
.row .nm{font-size:16px;font-weight:700;letter-spacing:-.3px;word-break:keep-all;display:flex;align-items:center;gap:6px}
.badge{font-size:10px;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:2px 7px;border-radius:999px;flex-shrink:0}
.row .pv{font-size:12.5px;color:var(--sub);margin-top:3px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:#C5C5CC;flex-shrink:0}
.count{font-size:13px;color:var(--sub);font-weight:600;margin:16px 4px 0;text-align:center}
.empty{text-align:center;color:var(--sub);font-size:15px;font-weight:500;padding:60px 0}
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(248,248,250,.82);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--hair);padding:9px 0 26px;z-index:30}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;border:none;background:none;cursor:pointer;color:var(--sub);font-size:10.5px;font-weight:700;transition:.15s}
.tab.on{color:var(--accent)} .tab:active{transform:scale(.92)}
.detail{position:absolute;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;animation:slidein .34s cubic-bezier(.2,.75,.2,1) both}
.dnav{position:sticky;top:0;display:flex;align-items:center;padding:14px 12px;background:rgba(242,242,247,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--hair);z-index:5}
.dnav button{display:flex;align-items:center;gap:1px;border:none;background:none;color:var(--accent);font-size:16px;font-weight:600;cursor:pointer;padding:6px 8px;border-radius:10px}
.dnav .dttl{font-size:16px;font-weight:700;flex:1;text-align:center;margin-right:54px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbody{flex:1;overflow-y:auto;padding:6px 18px 60px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes rot{to{transform:rotate(360deg)}}
.fade{animation:fade .4s ease both}
